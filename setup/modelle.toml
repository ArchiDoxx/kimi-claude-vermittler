# Claude-Modelle fuer Kimi Code CLI (Provider anthropic). Stand 2026-10-11, Kimi 2.1.1.
# setup/setup.mjs haengt jeden Block nur an, wenn [models."<alias>"] in config.toml fehlt.
# always_thinking ist bei Opus 5.5, Sonnet 5.5, Fable 5 und Fable 5.1 Pflicht (sonst 400).

[models."anthropic/claude-haiku-4-5"]
provider = "anthropic"
model = "claude-haiku-4-5"
max_context_size = 200000
max_output_size = 64000
capabilities = [ "image_in", "thinking", "tool_use" ]
display_name = "Claude Haiku 4.5 (latest)"

[models."anthropic/claude-opus-4-5"]
provider = "anthropic"
model = "claude-opus-4-5"
max_context_size = 200000
max_output_size = 64000
capabilities = [ "image_in", "thinking", "tool_use" ]
display_name = "Claude Opus 4.5 (latest)"
support_efforts = [ "low", "medium", "high" ]

